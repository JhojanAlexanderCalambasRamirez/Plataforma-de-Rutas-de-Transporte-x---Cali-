<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Conductor</title>
  <link rel="stylesheet" href="../Styles/styleConductor.css">
</head>
<body>
  <h1>Conductor - Rutas Valle</h1>

  <section>
    <h2>Registro y Ruta</h2>
    <input type="text" id="nombre" placeholder="Tu Nombre">
    <input type="text" id="placa" placeholder="Placa del Vehículo">
    <input type="text" id="rutaAsignada" placeholder="Ruta Asignada">
    <button onclick="registrarYCompartir()">Registrar y Compartir Ubicación</button>
  </section>

  <script>
    const baseURL = "http://localhost:5001/rutas-valle/us-central1";

    async function registrarYCompartir() {
      const nombre = document.getElementById("nombre").value;
      const placa = document.getElementById("placa").value;
      const rutaAsignada = document.getElementById("rutaAsignada").value;

      if (!nombre || !placa || !rutaAsignada) {
        alert("Por favor completa todos los campos.");
        return;
      }

      if (!navigator.geolocation) {
        alert("Tu navegador no soporta geolocalización.");
        return;
      }

      navigator.geolocation.getCurrentPosition(async position => {
        const { latitude, longitude } = position.coords;

        const res = await fetch(`${baseURL}/registrarConductor`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            nombre,
            placa,
            rutaAsignada,
            latitud: latitude,
            longitud: longitude
          })
        });

        const data = await res.json();
        alert(data.mensaje || "Conductor registrado");
      }, error => {
        alert("Error al obtener ubicación: " + error.message);
      });
    }
  </script>
</body>
</html>
